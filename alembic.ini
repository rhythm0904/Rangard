# alembic.ini
# Alembic is the standard database migration tool for SQLAlchemy.
# It tracks changes to your DB schema over time — like Git for your database.
#
# HOW TO USE:
#   Initial setup (run once):
#     alembic init alembic
#
#   Create a new migration after changing models.py:
#     alembic revision --autogenerate -m "add threat_intel table"
#
#   Apply all pending migrations:
#     alembic upgrade head
#
#   Roll back one migration:
#     alembic downgrade -1

[alembic]
script_location = alembic
prepend_sys_path = .

# Use environment variable for the DB URL
sqlalchemy.url = %(DATABASE_SYNC_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
