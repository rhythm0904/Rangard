# nginx/rangard.conf
# ──────────────────────
# Production Nginx config for RANGARD.
#
# SETUP:
#   1. Copy to /etc/nginx/sites-available/rangard
#   2. symlink: ln -s /etc/nginx/sites-available/rangard /etc/nginx/sites-enabled/
#   3. Replace 'api.rangard.app' with your actual domain
#   4. Get SSL cert: certbot --nginx -d api.rangard.app
#   5. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name api.rangard.app;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.rangard.app;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/api.rangard.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rangard.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "DENY"              always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "strict-origin"     always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Max upload size (matches MAX_FILE_SIZE_MB in .env)
    client_max_body_size 52M;

    # Rate limiting zone (defined in nginx.conf http block)
    # limit_req zone=api burst=20 nodelay;

    # Proxy to FastAPI
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # allow time for slow scans
        proxy_send_timeout 120s;
    }

    # Health check — no rate limiting needed
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # Block common attack paths
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
}
