version: "3.9"
# docker-compose.prod.yml — Production configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       rangard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not exposed externally in production — only accessible within Docker network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    volumes:
      - quarantine:/var/rangard/quarantine
    env_file: .env
    environment:
      APP_ENV:       production
      QUARANTINE_DIR: /var/rangard/quarantine
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Celery worker for background tasks (email, blockchain anchoring)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    volumes:
      - quarantine:/var/rangard/quarantine
    env_file: .env
    environment:
      APP_ENV: production
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
  redis_data:
  quarantine:
